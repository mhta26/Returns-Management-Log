name: Build Windows Desktop
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: python -m pip install -r requirements.txt pytest==8.3.5 pypdf==5.4.0 pyinstaller==6.13.0
        working-directory: desktop
      - run: python -m pytest -q tests
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
      - shell: pwsh
        run: ./desktop/packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ReturnsManager-Windows-x64
          path: desktop/release/*
          retention-days: 30
      - name: Publish downloadable desktop installers
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-v1.0.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Returns Manager Desktop 1.0.0" --notes-file desktop/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload desktop-v1.0.0 desktop/release/* --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
